name: extract-dyld-shared-cache

# Pull dyld_shared_cache_arm64e out of the iPadOS 18.7.10 (22H374) IPSW.
#
# Why macOS: the OS volume is 094-32804-038.dmg.aea (AEA-encrypted, 5.9 GB) and
# Cryptex1,SystemOS is another 1.6 GB AEA file. Windows has no AEA decryption;
# AEA keys for Apple IPSWs are not in BuildManifest.plist (Digest is sha2-384),
# so the blacktop/ipsw toolchain is the practical path.
#
# Usage:
#   1. copy to .github/workflows/ in a repo you own
#   2. Actions -> extract-dyld-shared-cache -> Run workflow
#   3. download the "dyld-cache" artifact
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: IPSW URL
        required: false
        default: https://updates.cdn-apple.com/2026WinterFCS/fullrestores/140-97955/A3F72236-89AD-47C5-8394-5E824079C175/iPad_10.2_18.7.10_22H374_Restore.ipsw

jobs:
  extract:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Show runner
        run: sw_vers && uname -m && df -h /

      - name: Download IPSW
        run: |
          set -euo pipefail
          curl -L --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw.zip" "${{ inputs.ipsw_url }}"
          ls -l "$RUNNER_TEMP/ipsw.zip"

      - name: Install ipsw
        run: |
          brew install blacktop/tap/ipsw
          ipsw version || true

      - name: Extract dyld shared cache with ipsw
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          ipsw extract --dyld "$RUNNER_TEMP/ipsw.zip" -o "$RUNNER_TEMP/out" || \
          ipsw dyld extract "$RUNNER_TEMP/ipsw.zip" -o "$RUNNER_TEMP/out" || true
          find "$RUNNER_TEMP/out" -type f -maxdepth 4 -print0 | xargs -0 ls -l | head -40 || true

      - name: Fallback: unzip and look for the cache in the plain volumes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          unzip -q -o "$RUNNER_TEMP/ipsw.zip" -d "$RUNNER_TEMP/ipsw" || true
          find "$RUNNER_TEMP/ipsw" -maxdepth 6 -name "dyld_shared_cache*" -print || true

      - name: Report what we found
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/out" -type f -name "dyld_shared_cache*" -print | tee "$RUNNER_TEMP/found.txt"
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            cd "$RUNNER_TEMP/out" && shasum -a 256 $(cat "$RUNNER_TEMP/found.txt") | tee SHA256SUMS
          else
            echo "no shared cache extracted" | tee "$RUNNER_TEMP/out/MISSING.txt"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyld-cache
          path: ${{ runner.temp }}/out
          compression-level: 0
          retention-days: 7
